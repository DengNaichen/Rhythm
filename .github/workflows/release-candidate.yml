name: macOS Release Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Candidate label, for example v1.1.0-rc1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rhythm-release-candidate-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate candidate source
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      xcode_build: ${{ steps.metadata.outputs.xcode_build }}

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate metadata
        id: metadata
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          release_tag="${INPUT_RELEASE_TAG}"
          if [[ "${commit_sha}" != "${main_sha}" ]]; then
            echo "Release candidate source must be the current origin/main commit." >&2
            exit 1
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "Candidate tag must match vMAJOR.MINOR.PATCH-rcN." >&2
            exit 1
          fi

          xcode_build="$(xcodebuild -version | awk '/Build version/{print $3}')"
          [[ -n "${xcode_build}" ]] || { echo "Unable to resolve Xcode build version." >&2; exit 1; }

          {
            echo "commit_sha=${commit_sha}"
            echo "release_tag=${release_tag}"
            echo "xcode_build=${xcode_build}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate version metadata
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TAG: ${{ steps.metadata.outputs.release_tag }}
          RELEASE_ARCHS: arm64
          RELEASE_COMMIT_SHA: ${{ steps.metadata.outputs.commit_sha }}
        run: ./Scripts/release.sh preflight

      - name: Lint formatting
        run: swift format lint --strict --recursive .

      - name: Build without signing
        run: |
          xcodebuild \
            -project Rhythm.xcodeproj \
            -scheme Rhythm \
            -configuration Debug \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5 \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-bare-slash-regex' \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -project Rhythm.xcodeproj \
            -scheme Rhythm \
            -configuration Debug \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5 \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-bare-slash-regex' \
            -only-testing:RhythmTests \
            test

  build:
    name: Sign and notarize candidate
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 75
    environment: release-candidate
    permissions:
      contents: read

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Xcode version
        shell: bash
        env:
          EXPECTED_XCODE_BUILD: ${{ needs.preflight.outputs.xcode_build }}
        run: |
          set -euo pipefail
          current_xcode_build="$(xcodebuild -version | awk '/Build version/{print $3}')"
          [[ "${current_xcode_build}" == "${EXPECTED_XCODE_BUILD}" ]] || {
            echo "Xcode changed between preflight and signing jobs." >&2
            exit 1
          }
          xcodebuild -version

      - name: Import Developer ID certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "${CERTIFICATE_BASE64}" ]] || { echo "Missing Developer ID certificate secret." >&2; exit 1; }
          [[ -n "${CERTIFICATE_PASSWORD}" ]] || { echo "Missing Developer ID certificate password." >&2; exit 1; }

          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          keychain_path="${RUNNER_TEMP}/rhythm-release-candidate.keychain-db"
          keychain_password="$(uuidgen)"
          login_keychain="$(security login-keychain -d user 2>/dev/null || true)"
          login_keychain="${login_keychain//\"/}"

          printf '%s' "${CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          keychain_search_list=("${keychain_path}")
          if [[ -n "${login_keychain}" ]]; then
            keychain_search_list+=("${login_keychain}")
          fi
          security list-keychains -d user -s "${keychain_search_list[@]}"
          security default-keychain -d user -s "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"

          {
            echo "RUNNER_CERTIFICATE_PATH=${certificate_path}"
            echo "RUNNER_KEYCHAIN_PATH=${keychain_path}"
            echo "RUNNER_KEYCHAIN_PASSWORD=${keychain_password}"
            echo "NOTARY_KEYCHAIN_PATH=${keychain_path}"
            echo "NOTARY_PROFILE=rhythm-notary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_ENV}"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID || secrets.NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD || secrets.NOTARY_APP_PASSWORD }}
        run: ./Scripts/setup-notarytool-profile.sh

      - name: Build candidate payload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARCHIVE_PROVISIONING_PROFILE_SPECIFIER: ${{ vars.ARCHIVE_PROVISIONING_PROFILE_SPECIFIER }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION || 'Developer ID Application' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_ARCHS: arm64
          RELEASE_COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
        run: ./Scripts/release.sh build

      - name: Upload release candidate artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rhythm-release-candidate-${{ needs.preflight.outputs.release_tag }}
          path: dist/github-release/${{ needs.preflight.outputs.release_tag }}/artifacts/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Clean temporary keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${RUNNER_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${RUNNER_KEYCHAIN_PATH}" || true
          fi
          if [[ -n "${RUNNER_CERTIFICATE_PATH:-}" ]]; then
            rm -f "${RUNNER_CERTIFICATE_PATH}"
          fi
