name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Xcode build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-rhythm-${{ hashFiles('**/Package.resolved', 'Rhythm.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-rhythm-

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Lint formatting
        shell: bash
        run: |
          if swift format --help >/dev/null 2>&1; then
            swift format lint --strict --recursive .
          else
            echo "swift format is unavailable on this runner; skipping."
          fi

      - name: Build
        run: |
          xcodebuild \
            -project Rhythm.xcodeproj \
            -scheme Rhythm \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5 \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-bare-slash-regex' \
            build

      - name: Test
        run: |
          xcodebuild \
            -project Rhythm.xcodeproj \
            -scheme Rhythm \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5 \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-bare-slash-regex' \
            -only-testing:RhythmTests \
            test
