name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Cache Xcode build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-rhythm-${{ hashFiles('**/Package.resolved', 'Rhythm.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-rhythm-

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate release tooling
        shell: zsh {0}
        run: |
          test -x Scripts/release.sh
          test -x Scripts/bump-version.sh
          test -x Scripts/setup-notarytool-profile.sh
          test -x Scripts/publish-github-release.sh
          zsh -n Scripts/release.sh
          zsh -n Scripts/bump-version.sh
          zsh -n Scripts/setup-notarytool-profile.sh
          zsh -n Scripts/publish-github-release.sh
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' .github/workflows/*.yml

      - name: Lint formatting
        shell: bash
        run: |
          if swift format --help >/dev/null 2>&1; then
            swift format lint --strict --recursive .
          else
            echo "swift format is unavailable on this runner; skipping."
          fi

      - name: Build
        run: |
          xcodebuild \
            -project Rhythm.xcodeproj \
            -scheme Rhythm \
            -configuration Debug \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5 \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-bare-slash-regex' \
            build

      - name: Test
        run: |
          xcodebuild \
            -project Rhythm.xcodeproj \
            -scheme Rhythm \
            -configuration Debug \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5 \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-bare-slash-regex' \
            -only-testing:RhythmTests \
            test
