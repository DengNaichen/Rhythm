name: Release Binary

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build notarized macOS release
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ github.ref_name }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PROFILE: rhythm-notary
      KEYCHAIN_PATH: ${{ runner.temp }}/rhythm-release.keychain-db
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CERTIFICATE_PATH: ${{ runner.temp }}/developer-id-application.p12

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate release secrets
        shell: bash
        run: |
          required=(
            DEVELOPER_ID_APPLICATION_P12_BASE64
            DEVELOPER_ID_APPLICATION_P12_PASSWORD
            NOTARY_APPLE_ID
            NOTARY_APP_PASSWORD
            APPLE_TEAM_ID
            KEYCHAIN_PASSWORD
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Import Developer ID certificate
        shell: bash
        run: |
          echo "${DEVELOPER_ID_APPLICATION_P12_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${DEVELOPER_ID_APPLICATION_P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcrun \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}

      - name: Store notary credentials
        shell: bash
        run: |
          xcrun notarytool store-credentials "${KEYCHAIN_PROFILE}" \
            --apple-id "${NOTARY_APPLE_ID}" \
            --password "${NOTARY_APP_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --keychain "${KEYCHAIN_PATH}"
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}

      - name: Build archive
        shell: bash
        run: ./Scripts/release.sh archive

      - name: Export signed app
        shell: bash
        run: ./Scripts/release.sh export

      - name: Notarize app
        shell: bash
        run: |
          APP_BUNDLE="dist/export/Rhythm.app" \
          ./Scripts/release.sh notarize

      - name: Staple app
        shell: bash
        run: |
          APP_BUNDLE="dist/export/Rhythm.app" \
          ./Scripts/release.sh staple

      - name: Package release asset
        shell: bash
        run: |
          APP_BUNDLE="dist/export/Rhythm.app" \
          VERSION="${VERSION}" \
          ./Scripts/release.sh package

      - name: Publish GitHub release assets
        shell: bash
        run: |
          gh release view "${VERSION}" >/dev/null 2>&1 || \
            gh release create "${VERSION}" --verify-tag --generate-notes

          gh release upload "${VERSION}" \
            "dist/Rhythm-${VERSION}.zip" \
            "dist/Rhythm-${VERSION}.zip.sha256" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clean temporary keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "${KEYCHAIN_PATH}" || true
          rm -f "${CERTIFICATE_PATH}"
